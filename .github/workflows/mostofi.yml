name: mostofi
# Everything but the synced upstream plugins, which the gate excludes: the gate
# also measures the root docs, scripts/, patches/ and the packaging files.
on:
  push:
    paths-ignore: ["plugins/context-mode/**", "plugins/mattpocock-skills/**"]
  pull_request:
    paths-ignore: ["plugins/context-mode/**", "plugins/mattpocock-skills/**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: astral-sh/setup-uv@v6
      - name: Tests, with 100% line and branch coverage
        run: |
          uv run --locked --python ${{ matrix.python }} --group test coverage run -m pytest -q
          uv run --locked --python ${{ matrix.python }} --group test coverage report
      - name: Doc gate on toolshed itself
        run: uv run --locked --python ${{ matrix.python }} mostofi check
