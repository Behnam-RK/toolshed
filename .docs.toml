# Written by `mostofi init` v1.2.0. Every key is optional.
# `mostofi --explain <rule>` prints the reasoning and knobs for one rule.
profile = "default"

[corpus]
code_globs = ["*.py", "*.sh"]

# [defaults]
# soft = 1000
# hard = 1400

# First match wins; the shipped README and docs/adr/ overrides are consulted last.
# Templates cite paths as they land in a consuming repo, and skills cite the
# repos they run in; neither resolves here.
[[overrides]]
pattern = "plugins/mostofi/src/docsteward/templates/**"
rules = { stale-file-ref = "off" }

[[overrides]]
pattern = "plugins/*/skills/**"
rules = { stale-file-ref = "off" }

[exclude]
paths = ["plugins/context-mode/**", "plugins/mattpocock-skills/**"]

[rules.adr-number-collision]
adr_glob = "docs/adr/[0-9][0-9][0-9][0-9]-*.md"
index = ""

